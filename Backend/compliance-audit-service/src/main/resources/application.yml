server:
  port: 8087

spring:
  application:
    name: compliance-audit-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      override-none: true
      allow-override: true
      override-system-properties: false
  datasource:
    url: jdbc:mysql://localhost:3306/ecotrack_compliance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

