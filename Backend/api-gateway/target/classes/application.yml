server:
  port: 8090

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  codec:
    max-in-memory-size: 150MB
  cloud:
    config:
      override-none: true
      allow-override: true
      override-system-properties: false
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # IAM Service (port 8081)
        - id: iam-auth
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**
        - id: iam-users
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/users/**
        - id: iam-notifications
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/notifications/**
        # Citizen Reporting Service (port 8083)
        - id: citizen-issues
          uri: lb://citizen-reporting-service
          predicates:
            - Path=/api/v1/issues/**
        # Environmental Monitoring Service (port 8084)
        - id: monitoring-sensors
          uri: lb://environmental-monitoring-service
          predicates:
            - Path=/api/v1/sensors/**
        - id: monitoring-sensor-data
          uri: lb://environmental-monitoring-service
          predicates:
            - Path=/api/v1/sensor-data/**
        - id: monitoring-analysis
          uri: lb://environmental-monitoring-service
          predicates:
            - Path=/api/v1/analysis/**
        - id: monitoring-csv
          uri: lb://environmental-monitoring-service
          predicates:
            - Path=/api/v1/upload-csv/**
        # Industry Compliance Service (port 8085)
        - id: industry-emissions
          uri: lb://industry-compliance-service
          predicates:
            - Path=/api/v1/emissions/**
        - id: industry-documents
          uri: lb://industry-compliance-service
          predicates:
            - Path=/api/v1/industry-documents/**
        # Project Management Service (port 8086)
        - id: project-projects
          uri: lb://project-management-service
          predicates:
            - Path=/api/v1/projects/**
        - id: project-reports
          uri: lb://project-management-service
          predicates:
            - Path=/api/v1/reports/**
        # Compliance Audit Service (port 8087)
        - id: compliance-records
          uri: lb://compliance-audit-service
          predicates:
            - Path=/api/v1/compliance/**
        - id: compliance-audits
          uri: lb://compliance-audit-service
          predicates:
            - Path=/api/v1/audits/**
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.ecotrack.gateway: DEBUG
