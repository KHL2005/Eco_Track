server:
  port: 8084

spring:
  application:
    name: environmental-monitoring-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      override-none: true
      allow-override: true
      override-system-properties: false
    openfeign:
      circuitbreaker:
        enabled: false
  jpa:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

