server:
  port: 8089

spring:
  application:
    name: environmental-monitoring-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      override-none: true
      allow-override: true
      override-system-properties: false
    openfeign:
      circuitbreaker:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ecotrack_monitoring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

