server:
  port: 8084

spring:
  application:
    name: citizen-reporting-service
  config:
    import: "optional:configserver:http://localhost:8888"
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 150MB
  cloud:
    config:
      override-none: true
      allow-override: true
      override-system-properties: false
    openfeign:
      circuitbreaker:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ecotrack_citizen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true


app:
  upload:
    dir: uploads/citizen-media
    allowed-types: image/jpeg,image/png,image/gif,video/mp4,video/avi,video/quicktime
    max-files-per-issue: 5
